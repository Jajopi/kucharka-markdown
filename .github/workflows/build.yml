# Builds the PDFs and HTML on every push to master (rolling "latest" release)
# and on every pushed tag (a release named after the tag).
name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # official images with pandoc, XeLaTeX and rsvg-convert preinstalled
  IMAGE: pandoc/latex:latest-ubuntu
  # fallback: an older image whose TeX Live year is already frozen, so its
  # packages always install from the (unchanging) historic repository
  FALLBACK_IMAGE: pandoc/latex:3.7-ubuntu

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          build() {
            docker run --rm -v "$PWD:/work" -w /work --entrypoint bash "$1" .github/build-in-docker.sh
          }
          if ! build "$IMAGE"; then
            echo "::warning::Build with $IMAGE failed, retrying with $FALLBACK_IMAGE."
            build "$FALLBACK_IMAGE"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kucharka
          path: |
            build/*.pdf
            build/*.zip

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/*.pdf build/kucharka-html.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (master)" \
            --notes "Automatically built from commit $GITHUB_SHA."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/*.pdf build/kucharka-html.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/*.pdf build/kucharka-html.zip \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
